services:
  laravel-nginx:
    container_name: laravel-nginx
    image: laravel-nginx
    build:
      context: .
      dockerfile: Dockerfile.local
      target: nginx
    ports:
      - "2011:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:delegated
    restart: always
    tty: true
    depends_on:
      - laravel-php
    networks:
      - custom

  laravel-php:
    container_name: laravel-php
    image: laravel-php
    build:
      context: .
      dockerfile: Dockerfile.local
      target: php
    volumes:
      - ./:/var/www/html:delegated
    restart: always
    tty: true
    depends_on:
      - laravel-mysql
    networks:
      - custom

  laravel-mysql:
    container_name: laravel-mysql
    image: laravel-mysql
    build:
      context: .
      dockerfile: Dockerfile.local
      target: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - database:/var/lib/mysql
    restart: always
    tty: true
    networks:
      - custom

  laravel-phpmyadmin:
    container_name: laravel-phpmyadmin
    image: laravel-phpmyadmin
    build:
      context: .
      dockerfile: Dockerfile.local
      target: phpmyadmin
    ports:
      - "2012:80"
    environment:
      PMA_HOST: laravel-mysql
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    restart: always
    tty: true
    depends_on:
      - laravel-mysql
    networks:
      - custom

  laravel-mailpit:
    container_name: laravel-mailpit
    image: laravel-mailpit
    build:
      context: .
      dockerfile: Dockerfile.local
      target: mailpit
    ports:
      - "2013:8025"
    restart: always
    tty: true
    networks:
      - custom

volumes:
  database:
    name: laravel-mysql-data

networks:
  custom:
    name: laravel
