services:
  filament-nginx:
    container_name: filament-nginx
    image: filament-nginx
    build:
      context: .
      dockerfile: Dockerfile.local
      target: nginx
    ports:
      - "2021:80"
    volumes:
      - ./:/var/www/html:delegated
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:delegated
    restart: always
    tty: true
    depends_on:
      - filament-php
    networks:
      - custom

  filament-php:
    container_name: filament-php
    image: filament-php
    build:
      context: .
      dockerfile: Dockerfile.local
      target: php
    volumes:
      - ./:/var/www/html:delegated
    restart: always
    tty: true
    depends_on:
      - filament-mysql
    networks:
      - custom

  filament-mysql:
    container_name: filament-mysql
    image: filament-mysql
    build:
      context: .
      dockerfile: Dockerfile.local
      target: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - database:/var/lib/mysql
    restart: always
    tty: true
    networks:
      - custom

  filament-phpmyadmin:
    container_name: filament-phpmyadmin
    image: filament-phpmyadmin
    build:
      context: .
      dockerfile: Dockerfile.local
      target: phpmyadmin
    ports:
      - "2022:80"
    environment:
      PMA_HOST: filament-mysql
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    restart: always
    tty: true
    depends_on:
      - filament-mysql
    networks:
      - custom

  filament-mailpit:
    container_name: filament-mailpit
    image: filament-mailpit
    build:
      context: .
      dockerfile: Dockerfile.local
      target: mailpit
    ports:
      - "2023:8025"
    restart: always
    tty: true
    networks:
      - custom

volumes:
  database:
    name: filament-mysql-data

networks:
  custom:
    name: filament
