services:
  nginx:
    container_name: laravel-nginx
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    ports:
      - "9999:80"
    volumes:
      - ../:/var/www/html:delegated
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:delegated
    restart: always
    tty: true
    depends_on:
      - php
    networks:
      - laravel-network

  php:
    container_name: laravel-php
    build:
      context: .
      dockerfile: Dockerfile
      target: php
    volumes:
      - ../:/var/www/html:delegated
    restart: always
    tty: true
    depends_on:
      - mysql
    networks:
      - laravel-network

  mysql:
    container_name: laravel-mysql
    build:
      context: .
      dockerfile: Dockerfile
      target: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
    volumes:
      - laravel-volume:/var/lib/mysql
    restart: always
    tty: true
    networks:
      - laravel-network

  phpmyadmin:
    container_name: laravel-phpmyadmin
    build:
      context: .
      dockerfile: Dockerfile
      target: phpmyadmin
    ports:
      - "7777:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    restart: always
    tty: true
    depends_on:
      - mysql
    networks:
      - laravel-network

  mailpit:
    container_name: laravel-mailpit
    build:
      context: .
      dockerfile: Dockerfile
      target: mailpit
    ports:
      - "5201:1025"
      - "5208:8025"
    restart: always
    tty: true
    networks:
      - laravel-network

networks:
  laravel-network:
    name: laravel-network
    driver: bridge
volumes:
  laravel-volume:
    name: laravel-volume
