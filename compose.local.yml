services:
  laravel-nginx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel-nginx.rule=Host(`laravel.localhost`)"
      - "traefik.http.routers.laravel-nginx.entrypoints=web"
      - "traefik.http.services.laravel-nginx.loadbalancer.server.port=80"
    container_name: laravel-nginx
    image: laravel-nginx
    build:
      context: .
      dockerfile: Dockerfile.local
      target: nginx
    volumes:
      - ./:/var/www/html:delegated
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:delegated
    restart: always
    tty: true
    depends_on:
      - laravel-php
    networks:
      - proxy

  laravel-php:
    container_name: laravel-php
    image: laravel-php
    build:
      context: .
      dockerfile: Dockerfile.local
      target: php
    volumes:
      - ./:/var/www/html:delegated
    restart: always
    tty: true
    depends_on:
      - laravel-mysql
    networks:
      - proxy

  laravel-mysql:
    container_name: laravel-mysql
    image: laravel-mysql
    build:
      context: .
      dockerfile: Dockerfile.local
      target: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - database:/var/lib/mysql
    restart: always
    tty: true
    networks:
      - proxy

  laravel-phpmyadmin:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel-phpmyadmin.rule=Host(`laravel.db.localhost`)"
      - "traefik.http.routers.laravel-phpmyadmin.entrypoints=web"
      - "traefik.http.services.laravel-phpmyadmin.loadbalancer.server.port=80"
    container_name: laravel-phpmyadmin
    image: laravel-phpmyadmin
    build:
      context: .
      dockerfile: Dockerfile.local
      target: phpmyadmin
    environment:
      PMA_HOST: laravel-mysql
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    restart: always
    tty: true
    depends_on:
      - laravel-mysql
    networks:
      - proxy

  laravel-mailpit:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel-mailpit.rule=Host(`laravel.mail.localhost`)"
      - "traefik.http.routers.laravel-mailpit.entrypoints=web"
      - "traefik.http.services.laravel-mailpit.loadbalancer.server.port=8025"
    container_name: laravel-mailpit
    image: laravel-mailpit
    build:
      context: .
      dockerfile: Dockerfile.local
      target: mailpit
    restart: always
    tty: true
    networks:
      - proxy

volumes:
  database:
    name: laravel-db

networks:
  proxy:
    external: true
