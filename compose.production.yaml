services:
  laravel-nginx:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel-nginx.rule=Host(`laravel.hkit.pro`)"
      - "traefik.http.routers.laravel-nginx.entrypoints=websecure"
      - "traefik.http.routers.laravel-nginx.tls.certresolver=myresolver"
    container_name: laravel-nginx
    image: laravel-nginx
    build:
      context: .
      dockerfile: Dockerfile.production
      target: nginx
    volumes:
      - ./:/var/www/html:delegated
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:delegated
    restart: always
    tty: true
    depends_on:
      - laravel-php
    networks:
      - proxy

  laravel-php:
    container_name: laravel-php
    image: laravel-php
    build:
      context: .
      dockerfile: Dockerfile.production
      target: php
    volumes:
      - ./:/var/www/html:delegated
    restart: always
    tty: true
    depends_on:
      - laravel-mysql
    networks:
      - proxy

  laravel-mysql:
    container_name: laravel-mysql
    image: laravel-mysql
    build:
      context: .
      dockerfile: Dockerfile.production
      target: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - database:/var/lib/mysql
    restart: always
    tty: true
    networks:
      - proxy

  laravel-phpmyadmin:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.laravel-phpmyadmin.rule=Host(`laravel.db.hkit.pro`)"
      - "traefik.http.routers.laravel-phpmyadmin.entrypoints=websecure"
      - "traefik.http.routers.laravel-phpmyadmin.tls.certresolver=myresolver"
    container_name: laravel-phpmyadmin
    image: laravel-phpmyadmin
    build:
      context: .
      dockerfile: Dockerfile.production
      target: phpmyadmin
    environment:
      PMA_HOST: laravel-mysql
    restart: always
    tty: true
    depends_on:
      - laravel-mysql
    networks:
      - proxy

volumes:
  database:
    name: laravel-db

networks:
  proxy:
    external: true
